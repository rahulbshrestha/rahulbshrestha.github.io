title: Rahul B. Shrestha
author: Rahul B. Shrestha
description: A curation of interesting links, books and articles on the Internet.
email: rahulshrestha0101@gmail.com
url: https://rahulbshrestha.github.io
baseurl: ""
permalink: /:title

# Links in the header, in order.
nav:
  - title: Home
    url: /
  - title: Blog
    url: /blog
  - title: Reading
    url: /reading

# Build settings
markdown: kramdown
highlighter: rouge
excerpt_separator: <!--more-->
plugins:
  - jekyll-feed
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
sass:
  sass_dir: _sass

# archive/ holds the old pre-Jekyll site; it's kept in the repo but not published.
exclude:
  - archive/
  - scripts/
  - Gemfile
  - Gemfile.lock
