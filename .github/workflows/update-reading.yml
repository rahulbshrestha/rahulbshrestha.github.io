name: Update reading list

# Pulls the Goodreads to-read shelf once a day and commits any changes,
# which republishes the Reading page.
on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch shelf from Goodreads
        run: python scripts/update_reading.py

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- _data/reading.json; then
            echo "Reading list unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/reading.json
            git commit -m "Update reading list from Goodreads"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own,
      # so request one explicitly.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
