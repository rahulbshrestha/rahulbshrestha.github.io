<div style="clear: both;"/>
<footer class="site-footer">
	<div>
    Get in touch: <a href="mailto:{{ site.email }}"><em>email</em></a>, <a href="https://github.com/rahulbshrestha"><em>github</em></a>, <a href="https://www.linkedin.com/in/rahulbshrestha"><em>linkedin</em></a>, <a href="https://twitter.com/rahulbshrestha"><em>twitter</em></a><span id="visit-count" hidden></span>
</div>
    thanks for visiting!
</footer>

<script src="{{ '/assets/js/hover-reveal.js' | relative_url }}"></script>
<script>
  // Total site visits from GoatCounter; stays hidden if the count can't be loaded
  fetch('https://rahulbshrestha.goatcounter.com/counter/TOTAL.json')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (data) {
      var el = document.getElementById('visit-count');
      el.textContent = ' / ' + data.count + ' visits';
      el.hidden = false;
    })
    .catch(function () {});
</script>
<script>
  // On the homepage, open every link outside the top bar in a new tab (email links excluded)
  if (document.querySelector('main.homepage')) document.querySelectorAll('a[href]').forEach(function (a) {
    if (a.closest('.site-header') || a.getAttribute('href').indexOf('mailto:') === 0) return;
    a.target = '_blank';
    a.rel = 'noopener';
  });
</script>
