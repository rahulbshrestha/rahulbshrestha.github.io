<header class="site-header" role="banner" id='header-bar'>

    <div class="wrapper">
        <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title | escape | replace: ". ", '<span class="title-dot">.</span> ' }}</a>

        <nav class="site-nav">
            {% for item in site.nav %}
            <a class="page-link" href="{{ item.url | relative_url }}"> {{ item.title }}</a>
            {% endfor %}
        </nav>
    </div>

</header>

<script>
var prevScrollpos = window.pageYOffset;
window.onscroll = function() {
var currentScrollPos = window.pageYOffset;
  if (prevScrollpos > currentScrollPos) {
    document.getElementById("header-bar").style.top = "0";
  } else {
    document.getElementById("header-bar").style.top = "-50px";
  }
  prevScrollpos = currentScrollPos;
}
</script>
